<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Inteligente da Qualidade — Datativo Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qandcrcjecawcfsvqfhr.supabase.co">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://esm.sh">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/dashboard-framework.css">
<script src="https://unpkg.com/lucide@1.27.0" defer></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-modulos">
    <div class="sidebar-brand">
      <div class="mark">D</div>
      <div class="name">Datativo<small>Industrial</small></div>
    </div>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav">
        <a href="../decision-center.html" class="sidebar-link"><i data-lucide="sparkles"></i> Decision Center</a>
        <a href="../cadastro/dashboard.html" class="sidebar-link"><i data-lucide="database"></i> Cadastro</a>
        <a href="../compras/dashboard.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Compras</a>
        <a href="../estoque/dashboard.html" class="sidebar-link"><i data-lucide="package"></i> Estoque</a>
        <a href="../vendas/dashboard.html" class="sidebar-link"><i data-lucide="trending-up"></i> Comercial</a>
        <a href="../pcp/dashboard.html" class="sidebar-link"><i data-lucide="calendar-clock"></i> PCP</a>
        <a href="../producao/dashboard.html" class="sidebar-link"><i data-lucide="factory"></i> Produção</a>
        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="badge-check"></i> Qualidade</a>
        <a href="../financeiro/dashboard.html" class="sidebar-link"><i data-lucide="wallet"></i> Financeiro</a>
        <a href="../logistica/dashboard.html" class="sidebar-link"><i data-lucide="truck"></i> Logística/Expedição</a>
        <a href="../manutencao/dashboard.html" class="sidebar-link"><i data-lucide="wrench"></i> Manutenção</a>
        <a href="../fiscal/dashboard.html" class="sidebar-link"><i data-lucide="file-text"></i> Fiscal</a>
        <a href="../rh/dashboard.html" class="sidebar-link"><i data-lucide="users-round"></i> RH</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="qlt-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, Charts, TimelineEngine,
  DataGrid, DetailDrawer, AnalysisDrawer,
} from '../../js/dtv-components.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

const fmt = v => Number(v||0).toLocaleString('pt-BR');

// ============================================================================
// QLT-001 — TODO dado abaixo é DE EXEMPLO (mesmo padrão de escopo das
// entregas anteriores da série: foco declarado é reutilização do framework).
//
// Quality Score bate exato com o mapeamento do ADR-006 — sem divergência
// de nome desta vez (diferente de Compras/PCP/Produção).
//
// Interpretações sem componente oficial equivalente exato:
// - "Mapa das Não Conformidades" → .dtv-mapa-placeholder (reservado desde
//   o SYS-001, mesmo tratamento do "Mapa da Fábrica" no PCP-001)
// - "Plano de Ação" → DataGrid (ação/responsável/prazo/status)
// - "Árvore de Causa" → seção arquitetural reservada (AnalysisDrawer
//   explicando que o componente de árvore de causa-raiz ainda não existe
//   na biblioteca) — mesmo princípio da Simulação de Impacto no PCP-001,
//   não inventei um componente de diagrama de árvore.
// ============================================================================

const resultado = WorkspaceLayout('qlt-main', {
  header: {
    titulo: 'Centro Inteligente da Qualidade',
    breadcrumb: 'Qualidade',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar inspeções, produtos, lotes...',
    acoesRapidas: [{ label: 'Casa de Tintas', icone: 'palette', href: 'casa-tintas.html' }, { label: 'Inspeções', icone: 'clipboard-check', href: 'inspecoes.html', primario: true }],
  },
  attentionCenter: {
    exemplo: true,
    alertas: [
      { tipo: 'Não Conformidade', prioridade: 'alta', icone: 'alert-triangle', mensagem: 'Taxa de reprovação do lote #4021 acima de 15% — investigação recomendada.', acaoSugerida: 'Ver inspeções', link: 'inspecoes.html' },
      { tipo: 'Plano de Ação', prioridade: 'media', icone: 'clock', mensagem: '2 ações corretivas com prazo vencendo esta semana.', acaoSugerida: 'Ver plano de ação', link: '#' },
    ],
  },
  healthScore: {
    nome: 'Quality Score',
    tituloSecao: 'Saúde da Qualidade',
    exemplo: true,
    fatores: [
      { nome: 'Taxa de aprovação', valor: 91, peso: 0.35 },
      { nome: 'Recorrência de NC', valor: 68, peso: 0.25 },
      { nome: 'Prazo do plano de ação', valor: 74, peso: 0.2 },
      { nome: 'Auditoria de processo', valor: 88, peso: 0.2 },
    ],
    historico: [{ data: 'Mai', nota: 72 }, { data: 'Jun', nota: 76 }, { data: 'Jul', nota: 81 }],
  },
  kpis: {
    itens: [
      { id: 'insp-pendentes', nome: 'Inspeções Pendentes', icone: 'clock', tom: 'tom-ambar', valorTexto: '9', clicavel: true },
      { id: 'taxa-aprovacao', nome: 'Taxa de Aprovação', icone: 'check-circle-2', tom: 'tom-verde', valorTexto: '91%', clicavel: true },
      { id: 'nc-abertas', nome: 'Não Conformidades Abertas', icone: 'alert-triangle', tom: 'tom-vermelho', valorTexto: '6', clicavel: true },
      { id: 'acoes-atraso', nome: 'Ações em Atraso', icone: 'clipboard-x', tom: 'tom-roxo', valorTexto: '2', clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: {
    titulo: 'Insights de Qualidade',
    exemplo: true,
    itens: [
      { categoria: 'Reprovação', texto: 'Lote #4021 concentra 40% das reprovações do mês', origem: 'Regra' },
      { categoria: 'Fornecedor', texto: 'Matéria-prima do Fornecedor Delta tem taxa de NC 2x a média', origem: 'IA' },
      { categoria: 'Plano de Ação', texto: 'Ações corretivas concluídas no prazo caíram 8% no trimestre', origem: 'Regra' },
    ],
  },
  decisionCenter: {
    exemplo: true,
    recomendacoes: [
      { titulo: 'Investigar causa-raiz do lote #4021', descricao: 'Concentra 40% das reprovações do mês — padrão fora do normal.', origem: 'Qualidade', impactoTexto: 'Redução de refugo', urgencia: 'alta', confianca: 83, acaoSugerida: 'Ver árvore de causa', exemplo: true },
      { titulo: 'Auditar matéria-prima do Fornecedor Delta', descricao: 'Taxa de não conformidade 2x acima da média dos demais fornecedores.', origem: 'Qualidade', impactoTexto: 'Redução de NC recorrente', urgencia: 'media', confianca: 75, acaoSugerida: 'Ver inspeções', exemplo: true },
    ],
  },
  analyticsArea: {
    slots: [
      { chave: 'mapa', id: 'qlt-slot-mapa', titulo: 'Mapa das Não Conformidades' },
      { chave: 'indicadores', id: 'qlt-slot-indicadores', titulo: 'Indicadores da Qualidade' },
      { chave: 'plano-acao', id: 'qlt-slot-plano', titulo: 'Plano de Ação', linha: 'secundaria' },
      { chave: 'timeline', id: 'qlt-slot-timeline', titulo: 'Timeline', linha: 'secundaria' },
      { chave: 'arvore', id: 'qlt-slot-arvore', titulo: 'Árvore de Causa', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Inspeções', id: 'qlt-inspecoes' },
});

// ---------- 5. Mapa das Não Conformidades — placeholder oficial ----------
document.getElementById(resultado.slots.mapa).innerHTML = `<div class="dtv-mapa-placeholder">Mapa das Não Conformidades — arquitetura pronta, aguardando componente geográfico do módulo</div>`;

// 8. Indicadores da Qualidade
const INDICADORES_EXEMPLO = [
  { nome: 'Aprovado', valor: 312, cor: '#1f7a5c' }, { nome: 'Reprovado', valor: 22, cor: '#c0392b' }, { nome: 'Retrabalho', valor: 14, cor: '#b76e11' },
];
Charts.donut(resultado.slots.indicadores, INDICADORES_EXEMPLO.map(i => ({ ...i, onClick: () => abrirDrilldownGenerico(i.nome, `${i.valor} unidades no período`) })), 'Total Inspecionado', fmt(INDICADORES_EXEMPLO.reduce((s,i)=>s+i.valor,0)));

// 7. Plano de Ação
DataGrid(resultado.slots['plano-acao'],
  [{ titulo: 'Ação' }, { titulo: 'Responsável' }, { titulo: 'Prazo' }, { titulo: 'Status' }],
  [
    { celulas: ['Revisar processo de recebimento — Fornecedor Delta', 'Qualidade', '02/08', '<span class="badge aberto">Em andamento</span>'], onClick: () => abrirDrilldownGenerico('Revisar processo de recebimento', 'Responsável: Qualidade · Prazo: 02/08') },
    { celulas: ['Treinamento de inspeção — Linha 1', 'RH', '05/08', '<span class="badge parcial">Vencendo</span>'], onClick: () => abrirDrilldownGenerico('Treinamento de inspeção', 'Responsável: RH · Prazo: 05/08') },
  ]
);

// 9. Timeline
const hoje = new Date().toISOString().slice(0,10);
TimelineEngine(resultado.slots.timeline, [
  { id: '1', tipo: 'Auditoria', titulo: 'Inspeção do lote #4021 concluída', data: hoje, hora: '09:40', autor: 'Qualidade' },
  { id: '2', tipo: 'Aprovação', titulo: 'Plano de ação #12 aprovado', data: hoje, hora: '11:20' },
], { agrupamento: 'dia', filtros: false });

// 11. Árvore de Causa — seção arquitetural reservada, sem componente de
// diagrama de árvore ainda (mesmo princípio da Simulação de Impacto)
document.getElementById(resultado.slots.arvore).innerHTML = `
  <p style="color:var(--ink-soft); font-size:13px; margin-bottom:10px;">Investigação de causa-raiz das não conformidades recorrentes.</p>
  <button type="button" class="btn primary" id="qlt-arvore-btn">Abrir Investigação</button>
  <div class="ca-tag-exemplo" style="display:inline-block; margin-top:8px;">arquitetura pronta — componente de árvore de causa ainda não existe</div>`;
document.getElementById('qlt-arvore-btn').addEventListener('click', () => {
  AnalysisDrawer({ titulo: 'Árvore de Causa', subtitulo: 'Investigação de causa-raiz', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura pronta — o componente de diagrama de árvore de causa (tipo Ishikawa/5 porquês) ainda não existe na biblioteca oficial. Quando existir, este painel mostrará a árvore completa de causas e efeitos.</p>` });
});

// ---------- Inspeções (Área Operacional) ----------
DataGrid(resultado.slots.operational,
  [{ titulo: 'Lote' }, { titulo: 'Produto' }, { titulo: 'Data' }, { titulo: 'Resultado' }, { titulo: 'Inspetor' }],
  [
    { celulas: ['#4021', 'Bobina Extra 40cm', '29/07', '<span class="badge negativo">Reprovado</span>', 'Ana'], onClick: () => abrirDetalheLote('#4021') },
    { celulas: ['#4019', 'Filme Termoencolhível', '28/07', '<span class="badge pago">Aprovado</span>', 'Carlos'], onClick: () => abrirDetalheLote('#4019') },
  ]
);

// ---------- Drawers (SYS-011) ----------
function abrirDrilldownGenerico(titulo, texto) {
  DetailDrawer({ titulo, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">${texto}</p><p style="color:var(--ink-faint); font-size:12px; margin-top:8px;">Estrutura de drill-down pronta — detalhamento real aparece aqui quando ligado à consulta correspondente.</p>` });
}
function abrirDetalheLote(numero) {
  DetailDrawer({ titulo: `Lote ${numero}`, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta — critérios de inspeção reais aparecem aqui quando ligados à consulta correspondente.</p>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'insp-pendentes': 'Inspeções Pendentes', 'taxa-aprovacao': 'Taxa de Aprovação', 'nc-abertas': 'Não Conformidades Abertas', 'acoes-atraso': 'Ações em Atraso' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta pra este KPI — composição real aparece aqui quando ligada à consulta correspondente.</p>` });
}

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'Qualidade', icone: 'badge-check', href: 'dashboard.html' },
    { label: 'Produção', icone: 'factory', href: '../producao/dashboard.html' },
    { label: 'Compras', icone: 'shopping-cart', href: '../compras/dashboard.html' },
    { label: 'PCP', icone: 'calendar-clock', href: '../pcp/dashboard.html' },
  ],
  acoes: [{ label: 'Abrir Inspeções', icone: 'clipboard-check', onExecutar: () => { window.location.href = 'inspecoes.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
