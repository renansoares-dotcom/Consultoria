<body>

<div class="app-shell">

        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="package"></i> Estoque</a>

      </nav>

      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="est-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, Charts, DataGrid,
  TimelineEngine, DetailDrawer, KPIGrid, Score, AttentionCenter,
  InsightGrid, DecisionCenter,
} from '../../js/dtv-components.js';
import {
  calcularValorTotalEstoque, calcularViolacoesEstoqueMinimo, calcularViolacoesEstoqueMaximo,
  calcularRuptura, calcularGiroEstoque, calcularCoberturaDias, calcularCurvaABC,
  calcularProdutosParados, calcularTendenciaEstoque, calcularScore,
} from '../../js/analytics-engine.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2});
const DIAS_PERIODO = 30;

// ============================================================================
// SPRINT 004 — Estoque Enterprise. TODO indicador abaixo é cálculo REAL do
// Analytics Engine (js/analytics-engine.js), não dado de exemplo — mesmo
// princípio do Financeiro (Sprint 003). Dado real do tenant hoje é esparso
// (1 produto de teste cadastrado) — os números vão refletir isso
// honestamente, não é bug se aparecer quase tudo zerado.
//
// "Acuracidade" fica de fora — não existe tabela de inventário/contagem
// física no banco (confirmado por auditoria), arquitetura reservada.
// ============================================================================

const resultado = WorkspaceLayout('est-main', {
  header: {
    titulo: 'Centro Inteligente de Estoque',
    breadcrumb: 'Estoque',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar produtos...',
    acoesRapidas: [{ label: 'Catálogo de Produtos', icone: 'list', href: 'catalogo.html' }, { label: 'Novo Produto', icone: 'plus', href: 'produto-novo.html', primario: true }],
  },
  attentionCenter: { titulo: 'Central de Atenção', alertas: [] }, // populado abaixo com dado real
  healthScore: { nome: 'Inventory Score', tituloSecao: 'Saúde do Estoque', nota: 0, subMetricas: [] }, // populado abaixo
  kpis: {
    itens: [
      { id: 'valor-total', nome: 'Valor Total em Estoque', icone: 'wallet', tom: 'tom-verde', valorTexto: 'R$ 0,00', clicavel: true },
      { id: 'ruptura', nome: 'Produtos em Ruptura', icone: 'alert-triangle', tom: 'tom-vermelho', valorTexto: '0', clicavel: true },
      { id: 'giro', nome: 'Giro de Estoque (30d)', icone: 'refresh-cw', tom: 'tom-azul', valorTexto: '0,00x', clicavel: true },
      { id: 'parados', nome: 'Produtos Parados (30d)', icone: 'pause-circle', tom: 'tom-ambar', valorTexto: '0', clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: { titulo: 'Insights de Estoque', itens: [] }, // populado abaixo
  decisionCenter: { recomendacoes: [] }, // populado abaixo
  analyticsArea: {
    slots: [
      { chave: 'abc', id: 'est-slot-abc', titulo: 'Curva ABC (por valor)' },
      { chave: 'limites', id: 'est-slot-limites', titulo: 'Estoque Mínimo / Máximo' },
      { chave: 'timeline', id: 'est-slot-timeline-analytics', titulo: 'Timeline de Movimentações', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Produtos', id: 'est-produtos-tabela' },
});

let produtosCache = [], movimentacoesCache = [];

async function carregarDadosEstoque() {
  const [{ data: produtos }, { data: movimentacoes }] = await Promise.all([
    supabase.from('produtos').select('id, nome, codigo, saldo_atual, saldo_minimo, estoque_maximo, custo_medio, saldo_reservado, gera_estoque').eq('ativo', true),
    supabase.from('estoque_movimentacoes').select('produto_id, tipo, quantidade, origem, data')
      .gte('data', new Date(Date.now() - DIAS_PERIODO * 86400000).toISOString().slice(0,10)),
  ]);
  produtosCache = produtos || [];
  movimentacoesCache = movimentacoes || [];
}

function renderTudo() {
  const produtosComEstoque = produtosCache.filter(p => p.gera_estoque !== false);

  // KPIs
  const valorTotal = calcularValorTotalEstoque(produtosCache);
  const ruptura = calcularRuptura(produtosCache);
  const giro = calcularGiroEstoque(produtosCache, movimentacoesCache);
  const parados = calcularProdutosParados(produtosCache, movimentacoesCache, DIAS_PERIODO);
  KPIGrid('wl-kpis', [
    { id: 'valor-total', nome: 'Valor Total em Estoque', icone: 'wallet', tom: 'tom-verde', valorTexto: fmt(valorTotal), clicavel: true },
    { id: 'ruptura', nome: 'Produtos em Ruptura', icone: 'alert-triangle', tom: 'tom-vermelho', valorTexto: String(ruptura.length), clicavel: true },
    { id: 'giro', nome: 'Giro de Estoque (30d)', icone: 'refresh-cw', tom: 'tom-azul', valorTexto: giro.toFixed(2) + 'x', clicavel: true },
    { id: 'parados', nome: 'Produtos Parados (30d)', icone: 'pause-circle', tom: 'tom-ambar', valorTexto: String(parados.length), clicavel: true },
  ], (id) => abrirDetalheKPI(id));

  // Health Score — Inventory Score real, 4 fatores
  const violMin = calcularViolacoesEstoqueMinimo(produtosCache);
  const violMax = calcularViolacoesEstoqueMaximo(produtosCache);
  const totalComEstoque = Math.max(produtosComEstoque.length, 1);
  const fatores = [
    { nome: 'Disponibilidade (sem ruptura)', valor: Math.round((1 - ruptura.length / totalComEstoque) * 100), peso: 0.35 },
    { nome: 'Dentro do estoque mínimo', valor: Math.round((1 - violMin.length / totalComEstoque) * 100), peso: 0.25 },
    { nome: 'Dentro do estoque máximo', valor: Math.round((1 - violMax.length / totalComEstoque) * 100), peso: 0.2 },
    { nome: 'Giro saudável', valor: Math.min(100, Math.round(giro * 100)), peso: 0.2 },
  ];
  Score('wl-healthscore', { nome: 'Inventory Score', tituloSecao: 'Saúde do Estoque', nota: calcularScore(fatores), subMetricas: fatores.map(f => ({ nome: f.nome, valorTexto: f.valor + '%' })) });

  // Central de Atenção — real, a partir de ruptura/violações
  const alertas = [];
  if (ruptura.length) alertas.push({ tipo: 'Ruptura', prioridade: 'alta', icone: 'alert-triangle', mensagem: `${ruptura.length} produto(s) com saldo zerado.`, acaoSugerida: 'Ver produtos em ruptura', link: '#' });
  if (violMin.length) alertas.push({ tipo: 'Estoque Mínimo', prioridade: 'media', icone: 'trending-down', mensagem: `${violMin.length} produto(s) abaixo do estoque mínimo.`, acaoSugerida: 'Ver produtos', link: '#' });
  if (violMax.length) alertas.push({ tipo: 'Estoque Máximo', prioridade: 'baixa', icone: 'trending-up', mensagem: `${violMax.length} produto(s) acima do estoque máximo.`, acaoSugerida: 'Ver produtos', link: '#' });
  AttentionCenter('wl-attention', alertas);

  // Insights — reais
  const insights = [];
  if (parados.length) insights.push({ categoria: 'Produtos Parados', texto: `${parados.length} produto(s) sem nenhuma saída nos últimos ${DIAS_PERIODO} dias`, origem: 'Regra', grauConfianca: 90 });
  const abc = calcularCurvaABC(produtosCache);
  if (abc.A.length) insights.push({ categoria: 'Curva ABC', texto: `${abc.A.length} produto(s) concentram 80% do valor total em estoque (classe A)`, origem: 'Regra', grauConfianca: 92 });
  InsightGrid('wl-insights', insights);

  // Centro de Decisão — recomendações reais
  const recomendacoes = [];
  if (ruptura.length) recomendacoes.push({ titulo: 'Repor produtos em ruptura', descricao: `${ruptura.length} produto(s) com saldo zerado — risco de parada de atendimento.`, origem: 'Estoque', impactoTexto: 'Risco de parada', urgencia: 'alta', confianca: 95, acaoSugerida: 'Ver produtos em ruptura' });
  if (parados.length) recomendacoes.push({ titulo: 'Revisar produtos parados', descricao: `${parados.length} produto(s) sem movimentação em ${DIAS_PERIODO} dias — capital parado.`, origem: 'Estoque', impactoTexto: 'Capital de giro', urgencia: 'baixa', confianca: 80, acaoSugerida: 'Ver produtos parados' });
  DecisionCenter('wl-decisions', recomendacoes);

  // Curva ABC (donut)
  const coresABC = { A: '#1f7a5c', B: '#b76e11', C: '#94a3b8' };
  const segmentosABC = ['A','B','C'].map(classe => ({
    nome: `Classe ${classe} (${abc[classe].length} produtos)`,
    valor: abc[classe].reduce((s,x) => s + x.valor, 0),
    cor: coresABC[classe],
  }));
  Charts.donut('est-slot-abc', segmentosABC, 'Valor Total', fmt(valorTotal).replace('R$ ',''));

  // Estoque Mínimo/Máximo (bar-list de violações)
  const violacoes = [
    ...violMin.map(p => ({ nome: p.nome, valor: Number(p.saldo_minimo) - Number(p.saldo_atual), onClick: () => abrirDetalheProduto(p) })),
    ...violMax.map(p => ({ nome: p.nome, valor: Number(p.saldo_atual) - Number(p.estoque_maximo), onClick: () => abrirDetalheProduto(p) })),
  ].sort((a,b) => b.valor - a.valor).slice(0, 8);
  Charts.barList('est-slot-limites', violacoes);

  // Timeline de Movimentações
  const eventosTimeline = movimentacoesCache.slice(0, 30).map((m, i) => {
    const p = produtosCache.find(x => x.id === m.produto_id);
    return { id: String(i), tipo: m.tipo === 'entrada' ? 'Entrada' : 'Saída', titulo: `${m.tipo === 'entrada' ? 'Entrada' : 'Saída'} — ${p?.nome || 'Produto'}`, descricao: `Origem: ${m.origem || '—'}`, data: m.data, valorTexto: `${m.tipo === 'entrada' ? '+' : '-'}${m.quantidade}` };
  });
  TimelineEngine(resultado.slots.timeline, eventosTimeline, { agrupamento: 'dia' });

  // Tabela de Produtos (Área Operacional)
  DataGrid(resultado.slots.operational,
    [{ titulo: 'Produto' }, { titulo: 'Saldo Atual', alinhamento: 'num' }, { titulo: 'Mínimo', alinhamento: 'num' }, { titulo: 'Máximo', alinhamento: 'num' }, { titulo: 'Reservado', alinhamento: 'num' }, { titulo: 'Status' }],
    produtosComEstoque.map(p => {
      const abaixo = Number(p.saldo_minimo || 0) > 0 && Number(p.saldo_atual || 0) < Number(p.saldo_minimo);
      const acima = Number(p.estoque_maximo || 0) > 0 && Number(p.saldo_atual || 0) > Number(p.estoque_maximo);
      const zerado = Number(p.saldo_atual || 0) <= 0;
      const status = zerado ? '<span class="badge negativo">Ruptura</span>' : abaixo ? '<span class="badge parcial">Abaixo do mínimo</span>' : acima ? '<span class="badge aberto">Acima do máximo</span>' : '<span class="badge pago">Normal</span>';
      return { celulas: [p.nome, String(p.saldo_atual ?? 0), String(p.saldo_minimo ?? '—'), String(p.estoque_maximo ?? '—'), String(p.saldo_reservado ?? 0), status], onClick: () => abrirDetalheProduto(p) };
    })
  );
}

function abrirDetalheProduto(p) {
  DetailDrawer({ titulo: p.nome, subtitulo: 'Detalhamento do produto', corpo: `
    <p style="color:var(--ink-soft); font-size:13px;">Saldo atual: <b style="color:var(--ink);">${p.saldo_atual ?? 0}</b></p>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:6px;">Estoque mínimo: ${p.saldo_minimo ?? '—'} · Estoque máximo: ${p.estoque_maximo ?? '—'}</p>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:6px;">Reservado: ${p.saldo_reservado ?? 0} · Custo médio: ${p.custo_medio != null ? fmt(p.custo_medio) : '—'}</p>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'valor-total': 'Valor Total em Estoque', 'ruptura': 'Produtos em Ruptura', 'giro': 'Giro de Estoque', 'parados': 'Produtos Parados' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta — detalhamento por produto aparece aqui quando ligado à consulta correspondente.</p>` });
}

await carregarDadosEstoque();
renderTudo();

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'Estoque', icone: 'package', href: 'dashboard.html' },
    { label: 'Compras', icone: 'shopping-cart', href: '../compras/dashboard.html' },
    { label: 'Produção', icone: 'factory', href: '../producao/dashboard.html' },
    { label: 'PCP', icone: 'calendar-clock', href: '../pcp/dashboard.html' },
  ],
  acoes: [{ label: 'Novo Produto', icone: 'plus', onExecutar: () => { window.location.href = 'produto-novo.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
