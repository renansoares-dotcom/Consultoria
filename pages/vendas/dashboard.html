<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial — Datativo Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qandcrcjecawcfsvqfhr.supabase.co">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://esm.sh">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/dashboard-framework.css">
<script src="https://unpkg.com/lucide@1.27.0" defer></script>
<style>
  #com-timeline { padding: 18px 24px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-modulos">
    <div class="sidebar-brand">
      <div class="mark">D</div>
      <div class="name">Datativo<small>Industrial</small></div>
    </div>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav">
        <a href="../decision-center.html" class="sidebar-link"><i data-lucide="sparkles"></i> Decision Center</a>
        <a href="../cadastro/dashboard.html" class="sidebar-link"><i data-lucide="database"></i> Cadastro</a>
        <a href="../compras/dashboard.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Compras</a>
        <a href="../estoque/dashboard.html" class="sidebar-link"><i data-lucide="package"></i> Estoque</a>
        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="trending-up"></i> Comercial</a>
        <a href="../pcp/dashboard.html" class="sidebar-link"><i data-lucide="calendar-clock"></i> PCP</a>
        <a href="../producao/dashboard.html" class="sidebar-link"><i data-lucide="factory"></i> Produção</a>
        <a href="../qualidade/dashboard.html" class="sidebar-link"><i data-lucide="badge-check"></i> Qualidade</a>
        <a href="../financeiro/dashboard.html" class="sidebar-link"><i data-lucide="wallet"></i> Financeiro</a>
        <a href="../logistica/dashboard.html" class="sidebar-link"><i data-lucide="truck"></i> Logística/Expedição</a>
        <a href="../manutencao/dashboard.html" class="sidebar-link"><i data-lucide="wrench"></i> Manutenção</a>
        <a href="../fiscal/dashboard.html" class="sidebar-link"><i data-lucide="file-text"></i> Fiscal</a>
        <a href="../rh/dashboard.html" class="sidebar-link"><i data-lucide="users-round"></i> RH</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="com-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, Charts, TimelineEngine,
  DataGrid, DetailDrawer,
} from '../../js/dtv-components.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2});
const CORES_SERIE = ['#1f7a5c', '#2f9e9e', '#b76e11', '#5b7fdb', '#8a63d2', '#c0392b', '#94a3b8'];

// ============================================================================
// RETROFIT (padrão de 9 seções) — Comercial migrado pro WorkspaceLayout.
// Mesmo conteúdo de exemplo do COM-001 original, agora 100% via
// componentes oficiais (nada de HTML de layout à mão, nada de drawer
// próprio). Duas seções que faltavam no padrão foram completadas aqui:
// Sales Score (bate com o ADR-006) e Centro de Decisão.
// ============================================================================

const resultado = WorkspaceLayout('com-main', {
  header: {
    titulo: 'Dashboard Executivo Comercial',
    breadcrumb: 'Comercial',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar clientes, pedidos, produtos...',
    grupoEmpresarial: { grupos: [{id:'g1',nome:'Datativo Industrial'}], grupoAtivo: 'g1', onTrocar: () => {} },
    acoesRapidas: [{ label: 'Pedidos de Venda', icone: 'list', href: 'pedidos.html' }, { label: 'Novo Pedido', icone: 'plus', href: 'pedido-novo.html', primario: true }],
  },
  hero: { rotulo: 'Receita do Período', valorTexto: fmt(487320.50), tendenciaTexto: '+12,4% em relação ao período anterior', icone: 'trending-up' },
  attentionCenter: {
    titulo: 'Central de Atenção Comercial',
    exemplo: true,
    alertas: [
      { tipo: 'Proposta parada', prioridade: 'alta', icone: 'alert-triangle', mensagem: 'Proposta com Cliente ABC sem movimentação há 12 dias.', acaoSugerida: 'Ver pipeline', link: '#' },
      { tipo: 'Meta do mês', prioridade: 'media', icone: 'target', mensagem: 'Faltam 18% pra bater a meta comercial do mês.', acaoSugerida: 'Ver evolução de vendas', link: '#' },
    ],
  },
  healthScore: {
    nome: 'Sales Score',
    tituloSecao: 'Saúde Comercial',
    exemplo: true,
    fatores: [
      { nome: 'Taxa de conversão', valor: 68, peso: 0.3 },
      { nome: 'Concentração de cliente', valor: 58, peso: 0.25 },
      { nome: 'Ciclo de venda', valor: 74, peso: 0.25 },
      { nome: 'Cumprimento de meta', valor: 82, peso: 0.2 },
    ],
    historico: [{ data: 'Mai', nota: 64 }, { data: 'Jun', nota: 69 }, { data: 'Jul', nota: 72 }],
  },
  kpis: {
    itens: [
      { id: 'ticket-medio', nome: 'Ticket Médio', icone: 'receipt', tom: 'tom-verde', valorTexto: fmt(8420.30), clicavel: true },
      { id: 'taxa-conversao', nome: 'Taxa de Conversão', icone: 'percent', tom: 'tom-azul', valorTexto: '34%', clicavel: true },
      { id: 'novos-clientes', nome: 'Novos Clientes', icone: 'user-plus', tom: 'tom-roxo', valorTexto: '9', clicavel: true },
      { id: 'pedidos-abertos', nome: 'Pedidos em Aberto', icone: 'clock', tom: 'tom-ambar', valorTexto: fmt(214800.00), clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: {
    titulo: 'Insights Comerciais',
    exemplo: true,
    itens: [
      { categoria: 'Vendedores', texto: 'Vendedor João superou a meta individual em 22%', origem: 'Regra' },
      { categoria: 'Produtos', texto: 'Bobina Extra vira o produto mais vendido do mês', origem: 'Regra' },
      { categoria: 'Clientes', texto: 'Cliente XYZ aumentou o volume de compra em 15%', origem: 'IA' },
    ],
  },
  decisionCenter: {
    exemplo: true,
    recomendacoes: [
      { titulo: 'Retomar contato com proposta parada', descricao: 'Proposta com Cliente ABC sem movimentação há 12 dias.', origem: 'Comercial', impactoTexto: 'Risco de perda', urgencia: 'alta', confianca: 74, acaoSugerida: 'Ver pipeline', exemplo: true },
      { titulo: 'Diversificar carteira de clientes', descricao: 'Concentração de receita em poucos clientes-chave.', origem: 'Comercial', impactoTexto: 'Redução de risco', urgencia: 'media', confianca: 68, acaoSugerida: 'Ver receita por cliente', exemplo: true },
    ],
  },
  analyticsArea: {
    slots: [
      { chave: 'evolucao', id: 'com-slot-evolucao', titulo: 'Evolução das Vendas' },
      { chave: 'vendedor', id: 'com-slot-vendedor', titulo: 'Receita por Vendedor' },
      { chave: 'cliente', id: 'com-slot-cliente', titulo: 'Receita por Cliente', linha: 'secundaria' },
      { chave: 'produto', id: 'com-slot-produto', titulo: 'Receita por Produto', linha: 'secundaria' },
      { chave: 'regiao', id: 'com-slot-regiao', titulo: 'Receita por Região', linha: 'secundaria' },
      { chave: 'pipeline', id: 'com-slot-pipeline', titulo: 'Pipeline Comercial', linha: 'secundaria' },
      { chave: 'timeline', id: 'com-slot-timeline', titulo: 'Timeline Comercial', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Últimas Vendas', id: 'com-vendas' },
});

// ---------- Evolução das Vendas ----------
const EVOLUCAO_VENDAS_EXEMPLO = [
  { label: 'fev/26', valor: 62000 }, { label: 'mar/26', valor: 71000 }, { label: 'abr/26', valor: 65500 },
  { label: 'mai/26', valor: 78000 }, { label: 'jun/26', valor: 81200 }, { label: 'jul/26', valor: 87400 },
];
Charts.barChart(resultado.slots.evolucao, EVOLUCAO_VENDAS_EXEMPLO.map(d => ({ ...d, onClick: () => abrirDrilldownGenerico(`Vendas — ${d.label}`, fmt(d.valor)) })));

// ---------- Receita por Vendedor ----------
const VENDEDORES_EXEMPLO = [
  { nome: 'João Silva', valor: 168400, cor: CORES_SERIE[0] }, { nome: 'Maria Souza', valor: 142200, cor: CORES_SERIE[1] },
  { nome: 'Pedro Lima', valor: 98600, cor: CORES_SERIE[2] }, { nome: 'Ana Costa', valor: 78120, cor: CORES_SERIE[3] },
];
Charts.donut(resultado.slots.vendedor, VENDEDORES_EXEMPLO.map(v => ({ ...v, onClick: () => abrirDrilldownGenerico(v.nome, `Receita gerada: ${fmt(v.valor)}`) })), 'Receita Total', fmt(VENDEDORES_EXEMPLO.reduce((s,v)=>s+v.valor,0)).replace('R$ ',''));

// ---------- Receita por Cliente ----------
const CLIENTES_EXEMPLO = [
  { nome: 'Cliente ABC Ltda', valor: 98400 }, { nome: 'Cliente XYZ Comércio', valor: 76200 },
  { nome: 'Indústria Delta', valor: 54100 }, { nome: 'Comércio Fenix', valor: 41800 }, { nome: 'Grupo Horizonte', valor: 33500 },
];
Charts.barList(resultado.slots.cliente, CLIENTES_EXEMPLO.map(c => ({ ...c, onClick: () => abrirDrilldownGenerico(c.nome, `Receita no período: ${fmt(c.valor)}`) })));

// ---------- Receita por Produto ----------
const PRODUTOS_EXEMPLO = [
  { nome: 'Bobina Extra 40cm', valor: 112300 }, { nome: 'Filme Termoencolhível', valor: 87400 },
  { nome: 'Saco Plástico Reforçado', valor: 65200 }, { nome: 'Filme Stretch', valor: 48900 },
];
Charts.barList(resultado.slots.produto, PRODUTOS_EXEMPLO.map(p => ({ ...p, onClick: () => abrirDrilldownGenerico(p.nome, `Receita no período: ${fmt(p.valor)}`) })));

// ---------- Receita por Região ----------
const REGIOES_EXEMPLO = [
  { nome: 'Sudeste', valor: 245100, cor: CORES_SERIE[0] }, { nome: 'Sul', valor: 112400, cor: CORES_SERIE[1] },
  { nome: 'Nordeste', valor: 78300, cor: CORES_SERIE[2] }, { nome: 'Centro-Oeste', valor: 51520, cor: CORES_SERIE[3] },
];
Charts.donut(resultado.slots.regiao, REGIOES_EXEMPLO.map(r => ({ ...r, onClick: () => abrirDrilldownGenerico(r.nome, `Receita da região: ${fmt(r.valor)}`) })), 'Receita Total', fmt(REGIOES_EXEMPLO.reduce((s,r)=>s+r.valor,0)).replace('R$ ',''));

// ---------- Pipeline Comercial — agora via DataGrid, componente oficial ----------
const PIPELINE_EXEMPLO = [
  { nome: 'Lead', valor: 145000, qtd: 32 }, { nome: 'Qualificado', valor: 98000, qtd: 21 },
  { nome: 'Proposta', valor: 76000, qtd: 14 }, { nome: 'Negociação', valor: 52000, qtd: 8 }, { nome: 'Fechado', valor: 38000, qtd: 5 },
];
DataGrid(resultado.slots.pipeline,
  [{ titulo: 'Etapa' }, { titulo: 'Oportunidades', alinhamento: 'num' }, { titulo: 'Valor', alinhamento: 'num' }],
  PIPELINE_EXEMPLO.map(p => ({ celulas: [p.nome, String(p.qtd), fmt(p.valor)], onClick: () => abrirDrilldownGenerico(`Pipeline — ${p.nome}`, `${p.qtd} oportunidades · ${fmt(p.valor)}`) }))
);

// ---------- Últimas Vendas (Área Operacional) ----------
const ROTULO_STATUS_COM = { aberto: 'Aberto', em_producao: 'Em Produção', faturado: 'Faturado' };
const CLASSE_STATUS_COM = { aberto: 'aberto', em_producao: 'parcial', faturado: 'pago' };
const VENDAS_EXEMPLO = [
  { data: '29/07/2026', cliente: 'Cliente ABC Ltda', vendedor: 'João Silva', produto: 'Bobina Extra 40cm', status: 'faturado', valor: 18400 },
  { data: '28/07/2026', cliente: 'Cliente XYZ Comércio', vendedor: 'Maria Souza', produto: 'Filme Termoencolhível', status: 'em_producao', valor: 12200 },
  { data: '27/07/2026', cliente: 'Indústria Delta', vendedor: 'Pedro Lima', produto: 'Saco Plástico Reforçado', status: 'aberto', valor: 9600 },
];
DataGrid(resultado.slots.operational,
  [{ titulo: 'Data' }, { titulo: 'Cliente' }, { titulo: 'Vendedor' }, { titulo: 'Produto' }, { titulo: 'Status' }, { titulo: 'Valor', alinhamento: 'num' }],
  VENDAS_EXEMPLO.map(v => ({ celulas: [v.data, v.cliente, v.vendedor, v.produto, `<span class="badge ${CLASSE_STATUS_COM[v.status]}">${ROTULO_STATUS_COM[v.status]}</span>`, fmt(v.valor)], onClick: () => abrirDrilldownGenerico(`Venda — ${v.cliente}`, `${v.produto} · ${fmt(v.valor)}`) }))
);

// ---------- Timeline Comercial ----------
const TIMELINE_COMERCIAL_EXEMPLO = [
  { id: '1', tipo: 'Pedido', titulo: 'Novo Pedido', descricao: 'Cliente ABC Ltda · João Silva', data: new Date().toISOString().slice(0,10), hora: '09:15', valorTexto: fmt(18400) },
  { id: '2', tipo: 'Proposta', titulo: 'Proposta Enviada', descricao: 'Indústria Delta · Pedro Lima', data: new Date().toISOString().slice(0,10), hora: '11:40', valorTexto: fmt(24500) },
  { id: '3', tipo: 'Fechamento', titulo: 'Fechamento', descricao: 'Cliente XYZ Comércio · Maria Souza', data: new Date().toISOString().slice(0,10), hora: '14:05', valorTexto: fmt(12200) },
];
TimelineEngine(resultado.slots.timeline, TIMELINE_COMERCIAL_EXEMPLO, { agrupamento: 'nenhum', filtros: false });

if (window.lucide) lucide.createIcons();

// ---------- Drawers (SYS-011) — único sistema de drawer, nada próprio ----------
function abrirDrilldownGenerico(titulo, texto) {
  DetailDrawer({ titulo, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">${texto}</p><p style="color:var(--ink-faint); font-size:12px; margin-top:8px;">Estrutura de drill-down pronta — detalhamento real aparece aqui quando ligado à consulta correspondente.</p>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'ticket-medio': 'Ticket Médio', 'taxa-conversao': 'Taxa de Conversão', 'novos-clientes': 'Novos Clientes', 'pedidos-abertos': 'Pedidos em Aberto' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta pra este KPI — composição real aparece aqui quando ligada à consulta correspondente.</p>` });
}

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'Comercial', icone: 'trending-up', href: 'dashboard.html' },
    { label: 'Financeiro', icone: 'wallet', href: '../financeiro/dashboard.html' },
    { label: 'Compras', icone: 'shopping-cart', href: '../compras/dashboard.html' },
    { label: 'Estoque', icone: 'package', href: '../estoque/dashboard.html' },
  ],
  acoes: [{ label: 'Novo Pedido', icone: 'plus', onExecutar: () => { window.location.href = 'pedido-novo.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});
</script>
</body>
</html>
