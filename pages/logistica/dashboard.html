<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Inteligente de Expedição e Logística — Datativo Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qandcrcjecawcfsvqfhr.supabase.co">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://esm.sh">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/dashboard-framework.css">
<script src="https://unpkg.com/lucide@1.27.0" defer></script>
<style>
  /* LOG-001 — mesmo ajuste já usado no CMP-001: o slot de Timeline usa o
     container de Área Operacional (card-tabela, sem padding por padrão,
     pensado pra tabela com padding próprio); TimelineEngine assume um
     card já com respiro. Não é componente novo, é 1 linha de CSS. */
  #log-timeline { padding: 18px 24px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-modulos">
    <div class="sidebar-brand">
      <div class="mark">D</div>
      <div class="name">Datativo<small>Industrial</small></div>
    </div>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav">
        <a href="../decision-center.html" class="sidebar-link"><i data-lucide="sparkles"></i> Decision Center</a>
        <a href="../cadastro/dashboard.html" class="sidebar-link"><i data-lucide="database"></i> Cadastro</a>
        <a href="../compras/dashboard.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Compras</a>
        <a href="../estoque/dashboard.html" class="sidebar-link"><i data-lucide="package"></i> Estoque</a>
        <a href="../vendas/dashboard.html" class="sidebar-link"><i data-lucide="trending-up"></i> Comercial</a>
        <a href="../pcp/dashboard.html" class="sidebar-link"><i data-lucide="calendar-clock"></i> PCP</a>
        <a href="../producao/dashboard.html" class="sidebar-link"><i data-lucide="factory"></i> Produção</a>
        <a href="../qualidade/dashboard.html" class="sidebar-link"><i data-lucide="badge-check"></i> Qualidade</a>
        <a href="../financeiro/dashboard.html" class="sidebar-link"><i data-lucide="wallet"></i> Financeiro</a>
        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="truck"></i> Logística/Expedição</a>
        <a href="../manutencao/dashboard.html" class="sidebar-link"><i data-lucide="wrench"></i> Manutenção</a>
        <a href="../fiscal/dashboard.html" class="sidebar-link"><i data-lucide="file-text"></i> Fiscal</a>
        <a href="../rh/dashboard.html" class="sidebar-link"><i data-lucide="users-round"></i> RH</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="log-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, Charts, TimelineEngine,
  DataGrid, MetricCard, DetailDrawer,
} from '../../js/dtv-components.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

// ============================================================================
// LOG-001 — TODO dado abaixo é DE EXEMPLO (mesmo padrão de escopo da série).
//
// Logistics Score é ADIÇÃO ao ADR-006 (Logística não estava nos 7 scores
// originais), mesmo caso do Asset Health Score no MNT-001.
//
// A ferramenta real de expedição (fila de pedidos prontos, botão "Expedir",
// "Confirmar Expedição", já testada em sessão anterior) foi preservada
// integralmente em expedicao.html, sem nenhuma alteração de conteúdo.
//
// "Entregas em Trânsito" e "arquitetura pra integração futura com
// rastreamento" andam juntas: virou DataGrid com nota explícita de que o
// rastreamento em tempo real ainda não existe — sem inventar componente de
// mapa/rastreamento ao vivo.
// "Torre de Controle Logística" → grid de MetricCard (mesmo padrão do
// Cockpit da Fábrica/Indicadores de Confiabilidade já usados na série).
// ============================================================================

const resultado = WorkspaceLayout('log-main', {
  header: {
    titulo: 'Centro Inteligente de Expedição e Logística',
    breadcrumb: 'Logística/Expedição',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar pedidos, romaneios, transportadoras...',
    acoesRapidas: [{ label: 'Notificações de Expedição', icone: 'bell', href: 'notificacao-expedicao.html' }, { label: 'Fila de Expedição', icone: 'truck', href: 'expedicao.html', primario: true }],
  },
  attentionCenter: {
    exemplo: true,
    alertas: [
      { tipo: 'Atraso', prioridade: 'alta', icone: 'alert-triangle', mensagem: '3 entregas em trânsito com previsão vencida.', acaoSugerida: 'Ver entregas em trânsito', link: '#' },
      { tipo: 'Transportadora', prioridade: 'media', icone: 'truck', mensagem: 'Transportadora Rápida com queda de 8% no SLA este mês.', acaoSugerida: 'Ver performance das transportadoras', link: '#' },
    ],
  },
  healthScore: {
    nome: 'Logistics Score',
    tituloSecao: 'Saúde da Logística',
    exemplo: true,
    fatores: [
      { nome: 'Entregas no prazo', valor: 87, peso: 0.35 },
      { nome: 'Avarias em trânsito', valor: 94, peso: 0.2 },
      { nome: 'Tempo médio de expedição', valor: 76, peso: 0.25 },
      { nome: 'Performance de transportadoras', valor: 81, peso: 0.2 },
    ],
    historico: [{ data: 'Mai', nota: 79 }, { data: 'Jun', nota: 82 }, { data: 'Jul', nota: 85 }],
  },
  kpis: {
    itens: [
      { id: 'prontos-expedir', nome: 'Prontos para Expedir', icone: 'package', tom: 'tom-azul', valorTexto: '17', clicavel: true },
      { id: 'em-transito', nome: 'Em Trânsito', icone: 'truck', tom: 'tom-ambar', valorTexto: '34', clicavel: true },
      { id: 'atrasadas', nome: 'Entregas Atrasadas', icone: 'alert-triangle', tom: 'tom-vermelho', valorTexto: '3', clicavel: true },
      { id: 'sla', nome: 'SLA Cumprido', icone: 'check-circle-2', tom: 'tom-verde', valorTexto: '87%', clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: {
    titulo: 'Insights de Logística',
    exemplo: true,
    itens: [
      { categoria: 'Transportadora', texto: 'Transportadora Rápida concentra 60% dos atrasos do mês', origem: 'Regra' },
      { categoria: 'Expedição', texto: 'Tempo médio de expedição caiu 15min na última semana', origem: 'Regra' },
      { categoria: 'Região', texto: 'Entregas para o Sul têm 2x mais atraso que a média', origem: 'IA' },
    ],
  },
  decisionCenter: {
    exemplo: true,
    recomendacoes: [
      { titulo: 'Reavaliar contrato com Transportadora Rápida', descricao: 'Concentra 60% dos atrasos do mês — queda de SLA de 8%.', origem: 'Logística', impactoTexto: 'Melhora de SLA', urgencia: 'alta', confianca: 78, acaoSugerida: 'Ver performance das transportadoras', exemplo: true },
      { titulo: 'Investigar atrasos recorrentes na região Sul', descricao: 'Taxa de atraso 2x acima da média das demais regiões.', origem: 'Logística', impactoTexto: 'Redução de atraso regional', urgencia: 'media', confianca: 70, acaoSugerida: 'Ver entregas em trânsito', exemplo: true },
    ],
  },
  analyticsArea: {
    slots: [
      { chave: 'painel', id: 'log-slot-painel', titulo: 'Painel de Expedição' },
      { chave: 'romaneios', id: 'log-slot-romaneios', titulo: 'Romaneios' },
      { chave: 'transito', id: 'log-slot-transito', titulo: 'Entregas em Trânsito', linha: 'secundaria' },
      { chave: 'transportadoras', id: 'log-slot-transportadoras', titulo: 'Performance das Transportadoras', linha: 'secundaria' },
      { chave: 'torre', id: 'log-slot-torre', titulo: 'Torre de Controle Logística', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Timeline', id: 'log-timeline' },
});

// ---------- 5. Painel de Expedição ----------
DataGrid(resultado.slots.painel,
  [{ titulo: 'Pedido' }, { titulo: 'Cliente' }, { titulo: 'Status' }, { titulo: 'Transportadora' }],
  [
    { celulas: ['#1042', 'Cliente ABC Ltda', '<span class="badge aberto">Pronto p/ expedir</span>', '—'], onClick: () => abrirDrilldownGenerico('Pedido #1042', 'Pronto para expedição') },
    { celulas: ['#1038', 'Cliente XYZ Comércio', '<span class="badge parcial">Em separação</span>', '—'], onClick: () => abrirDrilldownGenerico('Pedido #1038', 'Em separação') },
  ]
);

// 6. Romaneios
DataGrid(resultado.slots.romaneios,
  [{ titulo: 'Romaneio' }, { titulo: 'Data' }, { titulo: 'Pedidos' }, { titulo: 'Transportadora' }],
  [
    { celulas: ['RM-0512', '29/07', '4', 'Transportadora Rápida'], onClick: () => abrirDrilldownGenerico('Romaneio RM-0512', '4 pedidos · Transportadora Rápida') },
    { celulas: ['RM-0509', '28/07', '6', 'Transportadora Vega'], onClick: () => abrirDrilldownGenerico('Romaneio RM-0509', '6 pedidos · Transportadora Vega') },
  ]
);

// 7. Entregas em Trânsito — nota explícita sobre rastreamento futuro
DataGrid(resultado.slots.transito,
  [{ titulo: 'Pedido' }, { titulo: 'Transportadora' }, { titulo: 'Previsão' }, { titulo: 'Status' }],
  [
    { celulas: ['#1035', 'Transportadora Rápida', '28/07', '<span class="badge negativo">Atrasada</span>'], onClick: () => abrirDetalheEntrega('#1035') },
    { celulas: ['#1030', 'Transportadora Vega', '30/07', '<span class="badge aberto">No prazo</span>'], onClick: () => abrirDetalheEntrega('#1030') },
  ]
);

// 8. Performance das Transportadoras
const TRANSPORTADORAS_EXEMPLO = [
  { nome: 'Transportadora Vega', valor: 96 }, { nome: 'Transportadora Nortec', valor: 91 }, { nome: 'Transportadora Rápida', valor: 74 },
];
Charts.barList(resultado.slots.transportadoras, TRANSPORTADORAS_EXEMPLO.map(t => ({ nome: t.nome, valor: t.valor, onClick: () => abrirDrilldownGenerico(t.nome, `${t.valor}% de SLA no período`) })));

// 11. Torre de Controle Logística — grid de MetricCard
document.getElementById(resultado.slots.torre).innerHTML = `<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">${[
  MetricCard({ nome: 'Expedidos Hoje', valorTexto: '12' }),
  MetricCard({ nome: 'Em Trânsito', valorTexto: '34' }),
  MetricCard({ nome: 'Atrasados', valorTexto: '3' }),
  MetricCard({ nome: 'SLA do Dia', valorTexto: '89%' }),
].join('')}</div>`;

// ---------- Timeline (Área Operacional) ----------
const hoje = new Date().toISOString().slice(0,10);
TimelineEngine(resultado.slots.operational, [
  { id: '1', tipo: 'Expedição', titulo: 'Pedido #1029 expedido', descricao: 'Transportadora Vega', data: hoje, hora: '09:10' },
  { id: '2', tipo: 'Entrega', titulo: 'Pedido #1020 entregue ao cliente', data: hoje, hora: '11:45' },
  { id: '3', tipo: 'Ocorrência', titulo: 'Atraso reportado — Pedido #1035', descricao: 'Transportadora Rápida', data: hoje, hora: '14:20' },
], { agrupamento: 'dia' });

// ---------- Drawers (SYS-011) ----------
function abrirDrilldownGenerico(titulo, texto) {
  DetailDrawer({ titulo, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">${texto}</p><p style="color:var(--ink-faint); font-size:12px; margin-top:8px;">Estrutura de drill-down pronta — detalhamento real aparece aqui quando ligado à consulta correspondente.</p>` });
}
function abrirDetalheEntrega(numero) {
  DetailDrawer({ titulo: `Entrega — Pedido ${numero}`, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura pronta pra rastreamento — posição em tempo real aparece aqui quando a integração com rastreamento de entregas existir.</p><div class="ca-tag-exemplo" style="display:inline-block; margin-top:8px;">rastreamento em tempo real — arquitetura reservada, integração ainda não existe</div>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'prontos-expedir': 'Prontos para Expedir', 'em-transito': 'Em Trânsito', 'atrasadas': 'Entregas Atrasadas', 'sla': 'SLA Cumprido' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta pra este KPI — composição real aparece aqui quando ligada à consulta correspondente.</p>` });
}

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'Logística/Expedição', icone: 'truck', href: 'dashboard.html' },
    { label: 'Produção', icone: 'factory', href: '../producao/dashboard.html' },
    { label: 'Comercial', icone: 'trending-up', href: '../vendas/dashboard.html' },
    { label: 'Estoque', icone: 'package', href: '../estoque/dashboard.html' },
  ],
  acoes: [{ label: 'Abrir Fila de Expedição', icone: 'truck', onExecutar: () => { window.location.href = 'expedicao.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
