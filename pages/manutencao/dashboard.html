<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Inteligente de Manutenção — Datativo Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qandcrcjecawcfsvqfhr.supabase.co">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://esm.sh">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/dashboard-framework.css">
<script src="https://unpkg.com/lucide@1.27.0" defer></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-modulos">
    <div class="sidebar-brand">
      <div class="mark">D</div>
      <div class="name">Datativo<small>Industrial</small></div>
    </div>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav">
        <a href="../decision-center.html" class="sidebar-link"><i data-lucide="sparkles"></i> Decision Center</a>
        <a href="../cadastro/dashboard.html" class="sidebar-link"><i data-lucide="database"></i> Cadastro</a>
        <a href="../compras/dashboard.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Compras</a>
        <a href="../estoque/dashboard.html" class="sidebar-link"><i data-lucide="package"></i> Estoque</a>
        <a href="../vendas/dashboard.html" class="sidebar-link"><i data-lucide="trending-up"></i> Comercial</a>
        <a href="../pcp/dashboard.html" class="sidebar-link"><i data-lucide="calendar-clock"></i> PCP</a>
        <a href="../producao/dashboard.html" class="sidebar-link"><i data-lucide="factory"></i> Produção</a>
        <a href="../qualidade/dashboard.html" class="sidebar-link"><i data-lucide="badge-check"></i> Qualidade</a>
        <a href="../financeiro/dashboard.html" class="sidebar-link"><i data-lucide="wallet"></i> Financeiro</a>
        <a href="../logistica/dashboard.html" class="sidebar-link"><i data-lucide="truck"></i> Logística/Expedição</a>
        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="wrench"></i> Manutenção</a>
        <a href="../fiscal/dashboard.html" class="sidebar-link"><i data-lucide="file-text"></i> Fiscal</a>
        <a href="../rh/dashboard.html" class="sidebar-link"><i data-lucide="users-round"></i> RH</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="mnt-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, Charts, TimelineEngine,
  DataGrid, MetricCard, DetailDrawer,
} from '../../js/dtv-components.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

// ============================================================================
// MNT-001 — TODO dado abaixo é DE EXEMPLO (mesmo padrão de escopo da série).
//
// Asset Health Score é uma ADIÇÃO ao mapeamento do ADR-006, não uma
// divergência — Manutenção não estava entre os 7 scores originais mapeados
// naquele ADR (Financeiro, Comercial, Produção, Estoque, Compras,
// Qualidade, RH). Vale registrar essa adição junto das divergências já
// conhecidas quando o mapeamento for reconciliado.
//
// A ferramenta operacional completa de Manutenção (5 abas: Ordens,
// Solicitações, Planos, Equipamentos, Confiabilidade — já testada a fundo
// em sessão anterior, com os 4 triggers automáticos) foi preservada
// integralmente em operacional.html, sem nenhuma alteração de conteúdo.
//
// Interpretações sem componente oficial equivalente exato:
// - "Mapa dos Ativos" → .dtv-mapa-placeholder (reservado desde SYS-001)
// - "Plano Preventivo" → DataGrid
// - "Indicadores de Confiabilidade" → grid de MetricCard (MTBF/MTTR/
//   Disponibilidade — mesmo padrão do "Cockpit da Fábrica" no PRD-001)
// - "Ficha Inteligente do Equipamento" → DataGrid de equipamentos,
//   clicável, abrindo DetailDrawer com ficha + nota de manutenção
//   preditiva reservada (estrutura pronta, sem motor preditivo ainda)
// ============================================================================

const resultado = WorkspaceLayout('mnt-main', {
  header: {
    titulo: 'Centro Inteligente de Manutenção',
    breadcrumb: 'Manutenção',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar equipamentos, ordens, planos...',
    acoesRapidas: [{ label: 'Ferramenta Operacional', icone: 'wrench', href: 'operacional.html' }, { label: 'Nova Ordem', icone: 'plus', href: 'operacional.html', primario: true }],
  },
  attentionCenter: {
    exemplo: true,
    alertas: [
      { tipo: 'Preventiva', prioridade: 'alta', icone: 'alert-triangle', mensagem: '3 preventivas vencidas há mais de 5 dias.', acaoSugerida: 'Ver plano preventivo', link: '#' },
      { tipo: 'Ordem', prioridade: 'media', icone: 'clock', mensagem: 'Extrusora 2 com ordem de manutenção aberta há 40 minutos.', acaoSugerida: 'Ver ordens de serviço', link: 'operacional.html' },
    ],
  },
  healthScore: {
    nome: 'Asset Health Score',
    tituloSecao: 'Saúde dos Ativos',
    exemplo: true,
    fatores: [
      { nome: 'Cumprimento do preventivo', valor: 76, peso: 0.3 },
      { nome: 'MTBF (tempo entre falhas)', valor: 71, peso: 0.3 },
      { nome: 'MTTR (tempo de reparo)', valor: 82, peso: 0.2 },
      { nome: 'Idade média dos ativos críticos', valor: 64, peso: 0.2 },
    ],
    historico: [{ data: 'Mai', nota: 66 }, { data: 'Jun', nota: 70 }, { data: 'Jul', nota: 73 }],
  },
  kpis: {
    itens: [
      { id: 'os-abertas', nome: 'Ordens Abertas', icone: 'clipboard-list', tom: 'tom-azul', valorTexto: '11', clicavel: true },
      { id: 'preventivas-vencidas', nome: 'Preventivas Vencidas', icone: 'alert-triangle', tom: 'tom-vermelho', valorTexto: '3', clicavel: true },
      { id: 'mtbf', nome: 'MTBF Médio', icone: 'activity', tom: 'tom-verde', valorTexto: '186h', clicavel: true },
      { id: 'mttr', nome: 'MTTR Médio', icone: 'timer', tom: 'tom-roxo', valorTexto: '2,4h', clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: {
    titulo: 'Insights de Manutenção',
    exemplo: true,
    itens: [
      { categoria: 'Confiabilidade', texto: 'Extrusora 2 concentra 35% das paradas não programadas do mês', origem: 'Regra' },
      { categoria: 'Preventiva', texto: 'Cumprimento do plano preventivo caiu 6% no trimestre', origem: 'Regra' },
      { categoria: 'Preditiva', texto: 'Padrão de vibração da Extrusora 2 sugere desgaste de rolamento', origem: 'IA' },
    ],
  },
  decisionCenter: {
    exemplo: true,
    recomendacoes: [
      { titulo: 'Priorizar manutenção preventiva na Extrusora 2', descricao: 'Concentra 35% das paradas não programadas do mês — padrão recorrente.', origem: 'Manutenção', impactoTexto: 'Redução de parada não programada', urgencia: 'alta', confianca: 81, acaoSugerida: 'Ver ficha do equipamento', exemplo: true },
      { titulo: 'Regularizar as 3 preventivas vencidas', descricao: 'Vencidas há mais de 5 dias — risco de falha crescente.', origem: 'Manutenção', impactoTexto: 'Redução de risco de falha', urgencia: 'alta', confianca: 88, acaoSugerida: 'Ver plano preventivo', exemplo: true },
    ],
  },
  analyticsArea: {
    slots: [
      { chave: 'mapa', id: 'mnt-slot-mapa', titulo: 'Mapa dos Ativos' },
      { chave: 'confiabilidade', id: 'mnt-slot-confiabilidade', titulo: 'Indicadores de Confiabilidade' },
      { chave: 'preventivo', id: 'mnt-slot-preventivo', titulo: 'Plano Preventivo', linha: 'secundaria' },
      { chave: 'timeline', id: 'mnt-slot-timeline', titulo: 'Timeline', linha: 'secundaria' },
      { chave: 'ficha', id: 'mnt-slot-ficha', titulo: 'Ficha Inteligente do Equipamento', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Ordens de Serviço', id: 'mnt-ordens' },
});

// ---------- 5. Mapa dos Ativos — placeholder oficial ----------
document.getElementById(resultado.slots.mapa).innerHTML = `<div class="dtv-mapa-placeholder">Mapa dos Ativos — arquitetura pronta, aguardando componente geográfico do módulo</div>`;

// 8. Indicadores de Confiabilidade — grid de MetricCard
document.getElementById(resultado.slots.confiabilidade).innerHTML = `<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">${[
  MetricCard({ nome: 'MTBF', valorTexto: '186h' }),
  MetricCard({ nome: 'MTTR', valorTexto: '2,4h' }),
  MetricCard({ nome: 'Disponibilidade', valorTexto: '94,2%' }),
  MetricCard({ nome: 'Backlog de OS', valorTexto: '11' }),
].join('')}</div>`;

// 6. Plano Preventivo
DataGrid(resultado.slots.preventivo,
  [{ titulo: 'Equipamento' }, { titulo: 'Tipo' }, { titulo: 'Próxima Data' }, { titulo: 'Status' }],
  [
    { celulas: ['Extrusora 1', 'Lubrificação', '02/08', '<span class="badge aberto">No prazo</span>'], onClick: () => abrirDrilldownGenerico('Extrusora 1 — Lubrificação', 'Próxima data: 02/08') },
    { celulas: ['Extrusora 2', 'Troca de rolamento', '25/07', '<span class="badge negativo">Vencida</span>'], onClick: () => abrirDrilldownGenerico('Extrusora 2 — Troca de rolamento', 'Vencida desde 25/07') },
  ]
);

// 9. Timeline
const hoje = new Date().toISOString().slice(0,10);
TimelineEngine(resultado.slots.timeline, [
  { id: '1', tipo: 'Chamado', titulo: 'Parada não programada — Extrusora 2', data: hoje, hora: '13:05' },
  { id: '2', tipo: 'Aprovação', titulo: 'Ordem de manutenção #812 concluída', data: hoje, hora: '15:30', autor: 'Equipe Manutenção' },
], { agrupamento: 'dia', filtros: false });

// 11. Ficha Inteligente do Equipamento — DataGrid clicável abrindo o
// DetailDrawer com a ficha + nota de manutenção preditiva reservada
DataGrid(resultado.slots.ficha,
  [{ titulo: 'Equipamento' }, { titulo: 'Saúde' }],
  [
    { celulas: ['Extrusora 1', '<span class="badge pago">Boa</span>'], onClick: () => abrirFichaEquipamento('Extrusora 1', 'Boa') },
    { celulas: ['Extrusora 2', '<span class="badge negativo">Atenção</span>'], onClick: () => abrirFichaEquipamento('Extrusora 2', 'Atenção') },
  ]
);

// ---------- Ordens de Serviço (Área Operacional) ----------
DataGrid(resultado.slots.operational,
  [{ titulo: 'OS' }, { titulo: 'Equipamento' }, { titulo: 'Tipo' }, { titulo: 'Abertura' }, { titulo: 'Status' }],
  [
    { celulas: ['#812', 'Extrusora 2', 'Corretiva', 'Hoje 13:05', '<span class="badge aberto">Em andamento</span>'], onClick: () => abrirDetalheOS('#812') },
    { celulas: ['#809', 'Seladora', 'Preventiva', 'Ontem', '<span class="badge pago">Concluída</span>'], onClick: () => abrirDetalheOS('#809') },
  ]
);

// ---------- Drawers (SYS-011) ----------
function abrirDrilldownGenerico(titulo, texto) {
  DetailDrawer({ titulo, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">${texto}</p><p style="color:var(--ink-faint); font-size:12px; margin-top:8px;">Estrutura de drill-down pronta — detalhamento real aparece aqui quando ligado à consulta correspondente.</p>` });
}
function abrirDetalheOS(numero) {
  DetailDrawer({ titulo: `Ordem de Serviço ${numero}`, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta — histórico, custo e peças aparecem aqui quando ligados à consulta correspondente.</p>` });
}
function abrirFichaEquipamento(nome, saude) {
  DetailDrawer({ titulo: nome, subtitulo: 'Ficha Inteligente do Equipamento (dado de exemplo)', corpo: `
    <p style="color:var(--ink-soft); font-size:13px; margin-bottom:10px;">Saúde atual: <b style="color:var(--ink);">${saude}</b></p>
    <p style="color:var(--ink-soft); font-size:13px;">Estrutura pronta pra especificações, histórico completo de manutenção e indicadores individuais.</p>
    <div class="ca-tag-exemplo" style="display:inline-block; margin-top:10px;">manutenção preditiva — arquitetura reservada, motor ainda não existe</div>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'os-abertas': 'Ordens Abertas', 'preventivas-vencidas': 'Preventivas Vencidas', 'mtbf': 'MTBF Médio', 'mttr': 'MTTR Médio' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta pra este KPI — composição real aparece aqui quando ligada à consulta correspondente.</p>` });
}

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'Manutenção', icone: 'wrench', href: 'dashboard.html' },
    { label: 'Produção', icone: 'factory', href: '../producao/dashboard.html' },
    { label: 'Qualidade', icone: 'badge-check', href: '../qualidade/dashboard.html' },
    { label: 'PCP', icone: 'calendar-clock', href: '../pcp/dashboard.html' },
  ],
  acoes: [{ label: 'Abrir Ferramenta Operacional', icone: 'wrench', onExecutar: () => { window.location.href = 'operacional.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
