<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Inteligente de Gestão Tributária — Datativo Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qandcrcjecawcfsvqfhr.supabase.co">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://esm.sh">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/dashboard-framework.css">
<script src="https://unpkg.com/lucide@1.27.0" defer></script>
<style>
  /* FIS-001 — só composição de classes já oficiais pro Simulador Tributário
     e pro resumo IBS/CBS/Imposto Seletivo; nenhum componente novo. */
  .fis-simulador-corpo { display: flex; flex-direction: column; gap: 8px; }
  .fis-simulador-resultado { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--paper); font-size: 12.5px; }
  .fis-tributos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #fis-timeline { padding: 18px 24px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-modulos">
    <div class="sidebar-brand">
      <div class="mark">D</div>
      <div class="name">Datativo<small>Industrial</small></div>
    </div>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav">
        <a href="../decision-center.html" class="sidebar-link"><i data-lucide="sparkles"></i> Decision Center</a>
        <a href="../cadastro/dashboard.html" class="sidebar-link"><i data-lucide="database"></i> Cadastro</a>
        <a href="../compras/dashboard.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Compras</a>
        <a href="../estoque/dashboard.html" class="sidebar-link"><i data-lucide="package"></i> Estoque</a>
        <a href="../vendas/dashboard.html" class="sidebar-link"><i data-lucide="trending-up"></i> Comercial</a>
        <a href="../pcp/dashboard.html" class="sidebar-link"><i data-lucide="calendar-clock"></i> PCP</a>
        <a href="../producao/dashboard.html" class="sidebar-link"><i data-lucide="factory"></i> Produção</a>
        <a href="../qualidade/dashboard.html" class="sidebar-link"><i data-lucide="badge-check"></i> Qualidade</a>
        <a href="../financeiro/dashboard.html" class="sidebar-link"><i data-lucide="wallet"></i> Financeiro</a>
        <a href="../logistica/dashboard.html" class="sidebar-link"><i data-lucide="truck"></i> Logística/Expedição</a>
        <a href="../manutencao/dashboard.html" class="sidebar-link"><i data-lucide="wrench"></i> Manutenção</a>
        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="file-text"></i> Fiscal</a>
        <a href="../rh/dashboard.html" class="sidebar-link"><i data-lucide="users-round"></i> RH</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="fis-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, DataGrid, TimelineEngine,
  MetricCard, DetailDrawer, CreateDrawer,
} from '../../js/dtv-components.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
import { calcularTributo, buscarRegraVigente, TIPOS_TRIBUTO } from '../../js/tax-engine.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2});

// ============================================================================
// FIS-001 — AVISO IMPORTANTE: as regras abaixo são EXEMPLO ESTRUTURAL, não
// alíquotas reais. Nenhum valor aqui deve ser usado pra apurar tributo de
// verdade sem revisão de um contador/advogado tributário. O motor de
// cálculo real (js/tax-engine.js) já está testado (10 casos, incluindo
// convivência ICMS/IBS por vigência) — o que falta é só a parametrização
// real, que não é uma decisão técnica minha.
//
// "Nenhum cálculo tributário fora do Tax Engine": o Simulador abaixo é o
// ÚNICO lugar desta tela que calcula tributo, e chama calcularTributo() do
// motor — não reimplementa nada.
// ============================================================================

const REGRAS_EXEMPLO = [
  { id: 'r1', tipo: 'ICMS', descricao: 'ICMS regime atual (exemplo)', vigenciaInicio: '2020-01-01', vigenciaFim: '2025-12-31', parametros: { aliquota: 0.18 }, ativa: true },
  { id: 'r2', tipo: 'PIS', descricao: 'PIS regime atual (exemplo)', vigenciaInicio: '2020-01-01', vigenciaFim: '2025-12-31', parametros: { aliquota: 0.0165 }, ativa: true },
  { id: 'r3', tipo: 'COFINS', descricao: 'COFINS regime atual (exemplo)', vigenciaInicio: '2020-01-01', vigenciaFim: '2025-12-31', parametros: { aliquota: 0.076 }, ativa: true },
  { id: 'r4', tipo: 'IBS', descricao: 'IBS pós-reforma (exemplo — aguarda regulamentação)', vigenciaInicio: '2026-01-01', vigenciaFim: null, parametros: { aliquota: 0.10 }, ativa: true },
  { id: 'r5', tipo: 'CBS', descricao: 'CBS pós-reforma (exemplo — aguarda regulamentação)', vigenciaInicio: '2026-01-01', vigenciaFim: null, parametros: { aliquota: 0.05 }, ativa: true },
  { id: 'r6', tipo: 'IMPOSTO_SELETIVO', descricao: 'Imposto Seletivo (exemplo — aguarda regulamentação)', vigenciaInicio: '2027-01-01', vigenciaFim: null, parametros: { aliquota: 0.02 }, ativa: true },
];

const resultado = WorkspaceLayout('fis-main', {
  header: {
    titulo: 'Centro Inteligente de Gestão Tributária',
    breadcrumb: 'Fiscal',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar notas, regras, obrigações...',
    acoesRapidas: [{ label: 'Notas Fiscais', icone: 'file-text', href: 'notas.html', primario: true }],
  },
  attentionCenter: {
    titulo: 'Radar Tributário',
    exemplo: true,
    alertas: [
      { tipo: 'Reforma', prioridade: 'media', icone: 'radar', mensagem: 'IBS e CBS entram em vigência (exemplo) em 01/01/2026 — regras já cadastradas no motor.', acaoSugerida: 'Ver motor de regras', link: '#' },
      { tipo: 'Obrigação', prioridade: 'alta', icone: 'alert-triangle', mensagem: '2 obrigações acessórias com prazo vencendo esta semana.', acaoSugerida: 'Ver centro de obrigações', link: '#' },
    ],
  },
  kpis: {
    itens: [
      { id: 'notas-mes', nome: 'Notas Registradas no Mês', icone: 'file-text', tom: 'tom-azul', valorTexto: '142', clicavel: true },
      { id: 'obrigacoes-abertas', nome: 'Obrigações Abertas', icone: 'clipboard-list', tom: 'tom-ambar', valorTexto: '5', clicavel: true },
      { id: 'regras-vigentes', nome: 'Regras Vigentes', icone: 'shield-check', tom: 'tom-verde', valorTexto: String(REGRAS_EXEMPLO.filter(r=>r.ativa).length), clicavel: true },
      { id: 'regras-reforma', nome: 'Regras da Reforma Cadastradas', icone: 'landmark', tom: 'tom-roxo', valorTexto: String(REGRAS_EXEMPLO.filter(r=>TIPOS_TRIBUTO.reforma.includes(r.tipo)).length), clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: {
    titulo: 'Insights Fiscais',
    exemplo: true,
    itens: [
      { categoria: 'Reforma', texto: 'Transição para IBS/CBS parametrizada no motor, aguardando confirmação de alíquotas reais', origem: 'Regra' },
      { categoria: 'Obrigações', texto: 'Nenhuma obrigação em atraso no momento', origem: 'Regra' },
    ],
  },
  decisionCenter: {
    exemplo: true,
    recomendacoes: [
      { titulo: 'Validar alíquotas de exemplo com contador antes de usar em produção', descricao: 'O motor está pronto e testado — as alíquotas parametrizadas hoje são estruturais, não reais.', origem: 'Fiscal', impactoTexto: 'Conformidade legal', urgencia: 'alta', confianca: 95, acaoSugerida: 'Ver motor de regras tributárias', exemplo: true },
    ],
  },
  analyticsArea: {
    slots: [
      { chave: 'motor', id: 'fis-slot-motor', titulo: 'Motor de Regras Tributárias' },
      { chave: 'simulador', id: 'fis-slot-simulador', titulo: 'Simulador Tributário' },
      { chave: 'ibs-cbs-is', id: 'fis-slot-tributos', titulo: 'IBS · CBS · Imposto Seletivo', linha: 'secundaria' },
      { chave: 'obrigacoes', id: 'fis-slot-obrigacoes', titulo: 'Centro de Obrigações', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Timeline Fiscal', id: 'fis-timeline' },
});

// ---------- Motor de Regras Tributárias ----------
function renderMotorRegras() {
  DataGrid(resultado.slots.motor,
    [{ titulo: 'Tipo' }, { titulo: 'Descrição' }, { titulo: 'Vigência' }, { titulo: 'Alíquota', alinhamento: 'num' }],
    REGRAS_EXEMPLO.map(r => ({
      celulas: [r.tipo, r.descricao, `${r.vigenciaInicio} → ${r.vigenciaFim || 'sem fim'}`, `${(r.parametros.aliquota*100).toFixed(2)}%`],
      onClick: () => abrirDetalheRegra(r),
    }))
  );
}
renderMotorRegras();

// IBS · CBS · Imposto Seletivo — resumo em MetricCard
document.getElementById(resultado.slots['ibs-cbs-is']).innerHTML = `<div class="fis-tributos-grid">${[
  MetricCard({ nome: 'IBS', valorTexto: `${(REGRAS_EXEMPLO.find(r=>r.tipo==='IBS')?.parametros.aliquota*100 || 0).toFixed(1)}%` }),
  MetricCard({ nome: 'CBS', valorTexto: `${(REGRAS_EXEMPLO.find(r=>r.tipo==='CBS')?.parametros.aliquota*100 || 0).toFixed(1)}%` }),
  MetricCard({ nome: 'Imposto Seletivo', valorTexto: `${(REGRAS_EXEMPLO.find(r=>r.tipo==='IMPOSTO_SELETIVO')?.parametros.aliquota*100 || 0).toFixed(1)}%` }),
].join('')}</div>`;

// Centro de Obrigações
DataGrid(resultado.slots.obrigacoes,
  [{ titulo: 'Obrigação' }, { titulo: 'Vencimento' }, { titulo: 'Status' }],
  [
    { celulas: ['SPED Fiscal — Julho', '20/08', '<span class="badge aberto">Pendente</span>'], onClick: () => abrirDrilldownGenerico('SPED Fiscal — Julho', 'Vencimento: 20/08') },
    { celulas: ['DCTF — Julho', '15/08', '<span class="badge parcial">Em preparação</span>'], onClick: () => abrirDrilldownGenerico('DCTF — Julho', 'Vencimento: 15/08') },
  ]
);

// Simulador Tributário — REAL, chama o Tax Engine de verdade (única
// calculadora desta tela — "nenhum cálculo fora do Tax Engine")
document.getElementById(resultado.slots.simulador).innerHTML = `
  <div class="fis-simulador-corpo">
    <input class="input" type="number" id="fis-sim-valor" placeholder="Valor da operação (R$)" value="1000">
    <select class="input" id="fis-sim-tipo">${[...TIPOS_TRIBUTO.atuais, ...TIPOS_TRIBUTO.reforma].map(t => `<option value="${t}">${t}</option>`).join('')}</select>
    <input class="input" type="date" id="fis-sim-data" value="${new Date().toISOString().slice(0,10)}">
    <button type="button" class="btn primary" id="fis-sim-btn">Simular</button>
    <div class="fis-simulador-resultado" id="fis-sim-resultado">Preencha os campos e clique em Simular.</div>
    <span class="ca-tag-exemplo" style="align-self:flex-start;">alíquotas de exemplo — não usar em produção sem revisão contábil</span>
  </div>`;
document.getElementById('fis-sim-btn').addEventListener('click', () => {
  const valor = Number(document.getElementById('fis-sim-valor').value) || 0;
  const tipo = document.getElementById('fis-sim-tipo').value;
  const data = document.getElementById('fis-sim-data').value;
  const r = calcularTributo(valor, tipo, data, REGRAS_EXEMPLO);
  const resultadoEl = document.getElementById('fis-sim-resultado');
  resultadoEl.innerHTML = r.erro
    ? `<span style="color:var(--red);">${r.erro}</span>`
    : `<b>${tipo}</b>: ${fmt(r.valor)} (alíquota ${(r.aliquota*100).toFixed(2)}% · regra "${r.regraDescricao}")`;
});

// Timeline Fiscal
const hoje = new Date().toISOString().slice(0,10);
TimelineEngine(resultado.slots.operational, [
  { id: '1', tipo: 'Nota Fiscal', titulo: 'NF #45012 registrada', data: hoje, hora: '10:20' },
  { id: '2', tipo: 'Obrigação', titulo: 'DCTF de Junho enviada', data: hoje, hora: '09:00' },
], { agrupamento: 'dia' });

// ---------- Drawers (SYS-011) ----------
function abrirDrilldownGenerico(titulo, texto) {
  DetailDrawer({ titulo, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">${texto}</p>` });
}
function abrirDetalheRegra(r) {
  DetailDrawer({ titulo: `Regra — ${r.tipo}`, subtitulo: r.descricao, corpo: `
    <p style="color:var(--ink-soft); font-size:13px;">Vigência: ${r.vigenciaInicio} até ${r.vigenciaFim || 'sem data de fim'}</p>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:6px;">Alíquota: ${(r.parametros.aliquota*100).toFixed(2)}%</p>
    <div class="ca-tag-exemplo" style="display:inline-block; margin-top:10px;">valor de exemplo — requer validação contábil antes de produção</div>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'notas-mes': 'Notas Registradas no Mês', 'obrigacoes-abertas': 'Obrigações Abertas', 'regras-vigentes': 'Regras Vigentes', 'regras-reforma': 'Regras da Reforma Cadastradas' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta pra este KPI — composição real aparece aqui quando ligada à consulta correspondente.</p>` });
}

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'Fiscal', icone: 'file-text', href: 'dashboard.html' },
    { label: 'Financeiro', icone: 'wallet', href: '../financeiro/dashboard.html' },
    { label: 'Compras', icone: 'shopping-cart', href: '../compras/dashboard.html' },
    { label: 'Comercial', icone: 'trending-up', href: '../vendas/dashboard.html' },
  ],
  acoes: [{ label: 'Registrar Nota Fiscal', icone: 'plus', onExecutar: () => { window.location.href = 'notas.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
