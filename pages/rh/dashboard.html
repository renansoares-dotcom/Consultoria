<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Inteligente de Gestão de Pessoas — Datativo Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qandcrcjecawcfsvqfhr.supabase.co">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://esm.sh">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/dashboard-framework.css">
<script src="https://unpkg.com/lucide@1.27.0" defer></script>
<style>
  /* RH-001 — "Painel da Liderança" (item 11) composto só de MetricCard já
     oficial; 3 linhas de CSS de composição local, não é componente novo. */
  .rh-lideranca-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  #rh-timeline { padding: 18px 24px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-modulos">
    <div class="sidebar-brand">
      <div class="mark">D</div>
      <div class="name">Datativo<small>Industrial</small></div>
    </div>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav">
        <a href="../decision-center.html" class="sidebar-link"><i data-lucide="sparkles"></i> Decision Center</a>
        <a href="../cadastro/dashboard.html" class="sidebar-link"><i data-lucide="database"></i> Cadastro</a>
        <a href="../compras/dashboard.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Compras</a>
        <a href="../estoque/dashboard.html" class="sidebar-link"><i data-lucide="package"></i> Estoque</a>
        <a href="../vendas/dashboard.html" class="sidebar-link"><i data-lucide="trending-up"></i> Comercial</a>
        <a href="../pcp/dashboard.html" class="sidebar-link"><i data-lucide="calendar-clock"></i> PCP</a>
        <a href="../producao/dashboard.html" class="sidebar-link"><i data-lucide="factory"></i> Produção</a>
        <a href="../qualidade/dashboard.html" class="sidebar-link"><i data-lucide="badge-check"></i> Qualidade</a>
        <a href="../financeiro/dashboard.html" class="sidebar-link"><i data-lucide="wallet"></i> Financeiro</a>
        <a href="../logistica/dashboard.html" class="sidebar-link"><i data-lucide="truck"></i> Logística/Expedição</a>
        <a href="../manutencao/dashboard.html" class="sidebar-link"><i data-lucide="wrench"></i> Manutenção</a>
        <a href="../fiscal/dashboard.html" class="sidebar-link"><i data-lucide="file-text"></i> Fiscal</a>
        <a href="dashboard.html" class="sidebar-link active"><i data-lucide="users-round"></i> RH</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle-sidebar" style="width:100%; justify-content:center;"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>
  <div class="app-main">
<header class="topbar">
  <div class="brand">Datativo<span style="color:var(--accent)">Industrial</span><small>ERP</small></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">--</div>
      <span id="user-nome">Carregando…</span>
    </div>
  </div>
</header>

<main class="page" id="rh-main"></main>
  </div>
</div>

<script type="module">
import { supabase, exigirSessao, usuarioAtual } from '../../js/supabase-client.js';
import { initNav } from '../../js/nav.js';
import {
  WorkspaceLayout, GlobalSearch, CommandPalette, DataGrid, TimelineEngine,
  MetricCard, DetailDrawer,
} from '../../js/dtv-components.js';
import { buscarGlobalReal } from '../../js/dtv-search-provider.js';
initNav();

const sessao = await exigirSessao();
const usuario = await usuarioAtual();
if (usuario) {
  document.getElementById('user-nome').textContent = usuario.nome;
  document.getElementById('user-avatar').textContent = usuario.nome.slice(0,2).toUpperCase();
}
document.getElementById('user-chip').addEventListener('click', async () => {
  if (confirm('Sair do sistema?')) { await supabase.auth.signOut(); window.location.href = '../../index.html'; }
});

// ============================================================================
// RH-001 — TODO dado abaixo é DE EXEMPLO (mesmo padrão de escopo da série).
//
// People Score bate exato com o mapeamento do ADR-006 — sem divergência
// (mesmo caso do Quality Score).
//
// Interpretações sem componente oficial equivalente exato:
// - "Matriz de Competências" → DataGrid (funcionário × nível de
//   competência) — biblioteca não tem componente de matriz/heatmap ainda
// - "Mapa de Capacidades" → .dtv-mapa-placeholder (reservado desde SYS-001)
// - "Painel da Liderança" → grid de MetricCard (mesmo padrão já usado em
//   Cockpit da Fábrica/Torre de Controle/Indicadores de Confiabilidade)
// ============================================================================

const resultado = WorkspaceLayout('rh-main', {
  header: {
    titulo: 'Centro Inteligente de Gestão de Pessoas',
    breadcrumb: 'RH',
    buscaGlobal: true,
    buscaPlaceholder: 'Buscar funcionários, cargos, treinamentos...',
    acoesRapidas: [{ label: 'Funcionários', icone: 'users', href: 'funcionarios.html', primario: true }],
  },
  attentionCenter: {
    exemplo: true,
    alertas: [
      { tipo: 'Treinamento', prioridade: 'media', icone: 'graduation-cap', mensagem: '4 certificações de segurança vencendo nos próximos 30 dias.', acaoSugerida: 'Ver treinamentos', link: '#' },
      { tipo: 'Avaliação', prioridade: 'baixa', icone: 'clipboard-check', mensagem: '6 avaliações de desempenho pendentes este trimestre.', acaoSugerida: 'Ver avaliações', link: '#' },
    ],
  },
  healthScore: {
    nome: 'People Score',
    tituloSecao: 'Saúde de Pessoas',
    exemplo: true,
    fatores: [
      { nome: 'Retenção', valor: 88, peso: 0.3 },
      { nome: 'Engajamento', valor: 74, peso: 0.25 },
      { nome: 'Cumprimento de treinamento', valor: 81, peso: 0.25 },
      { nome: 'Cobertura de sucessão', valor: 62, peso: 0.2 },
    ],
    historico: [{ data: 'Mai', nota: 76 }, { data: 'Jun', nota: 79 }, { data: 'Jul', nota: 82 }],
  },
  kpis: {
    itens: [
      { id: 'headcount', nome: 'Headcount Total', icone: 'users', tom: 'tom-azul', valorTexto: '86', clicavel: true },
      { id: 'turnover', nome: 'Turnover Mensal', icone: 'trending-down', tom: 'tom-ambar', valorTexto: '2,1%', clicavel: true },
      { id: 'absenteismo', nome: 'Absenteísmo', icone: 'calendar-x', tom: 'tom-vermelho', valorTexto: '1,4%', clicavel: true },
      { id: 'treinamentos-mes', nome: 'Treinamentos no Mês', icone: 'graduation-cap', tom: 'tom-verde', valorTexto: '7', clicavel: true },
    ],
    onClickKpi: (id) => abrirDetalheKPI(id),
  },
  insights: {
    titulo: 'Insights de RH',
    exemplo: true,
    itens: [
      { categoria: 'Retenção', texto: 'Turnover da Produção 1,5x acima da média dos demais setores', origem: 'Regra' },
      { categoria: 'Sucessão', texto: '3 posições-chave sem sucessor identificado', origem: 'Regra' },
      { categoria: 'Engajamento', texto: 'Queda de engajamento concentrada no turno da noite', origem: 'IA' },
    ],
  },
  decisionCenter: {
    exemplo: true,
    recomendacoes: [
      { titulo: 'Mapear sucessores para as 3 posições-chave em aberto', descricao: 'Sem sucessor identificado — risco de continuidade em caso de saída.', origem: 'RH', impactoTexto: 'Redução de risco de sucessão', urgencia: 'alta', confianca: 77, acaoSugerida: 'Ver matriz de competências', exemplo: true },
      { titulo: 'Investigar turnover elevado na Produção', descricao: '1,5x acima da média dos demais setores nos últimos 3 meses.', origem: 'RH', impactoTexto: 'Redução de turnover', urgencia: 'media', confianca: 72, acaoSugerida: 'Ver painel da equipe', exemplo: true },
    ],
  },
  analyticsArea: {
    slots: [
      { chave: 'equipe', id: 'rh-slot-equipe', titulo: 'Painel da Equipe' },
      { chave: 'mapa', id: 'rh-slot-mapa', titulo: 'Mapa de Capacidades' },
      { chave: 'competencias', id: 'rh-slot-competencias', titulo: 'Matriz de Competências', linha: 'secundaria' },
      { chave: 'avaliacoes', id: 'rh-slot-avaliacoes', titulo: 'Avaliações', linha: 'secundaria' },
      { chave: 'treinamentos', id: 'rh-slot-treinamentos', titulo: 'Treinamentos', linha: 'secundaria' },
      { chave: 'lideranca', id: 'rh-slot-lideranca', titulo: 'Painel da Liderança', linha: 'secundaria' },
    ],
  },
  operationalArea: { titulo: 'Timeline', id: 'rh-timeline' },
});

// ---------- 5. Painel da Equipe ----------
DataGrid(resultado.slots.equipe,
  [{ titulo: 'Funcionário' }, { titulo: 'Cargo' }, { titulo: 'Departamento' }, { titulo: 'Status' }],
  [
    { celulas: ['Carlos Silva', 'Operador de Extrusora', 'Produção', '<span class="badge pago">Ativo</span>'], onClick: () => abrirDrilldownGenerico('Carlos Silva', 'Operador de Extrusora · Produção') },
    { celulas: ['Ana Souza', 'Inspetora de Qualidade', 'Qualidade', '<span class="badge pago">Ativo</span>'], onClick: () => abrirDrilldownGenerico('Ana Souza', 'Inspetora de Qualidade · Qualidade') },
  ]
);

// 6. Mapa de Capacidades — placeholder oficial
document.getElementById(resultado.slots.mapa).innerHTML = `<div class="dtv-mapa-placeholder">Mapa de Capacidades — arquitetura pronta, aguardando componente geográfico/organizacional do módulo</div>`;

// 6 (analítica). Matriz de Competências
DataGrid(resultado.slots.competencias,
  [{ titulo: 'Funcionário' }, { titulo: 'Competência' }, { titulo: 'Nível' }],
  [
    { celulas: ['Carlos Silva', 'Operação de Extrusora', '<span class="badge pago">Avançado</span>'], onClick: () => abrirDrilldownGenerico('Carlos Silva — Operação de Extrusora', 'Nível: Avançado') },
    { celulas: ['Ana Souza', 'Inspeção Visual', '<span class="badge parcial">Intermediário</span>'], onClick: () => abrirDrilldownGenerico('Ana Souza — Inspeção Visual', 'Nível: Intermediário') },
  ]
);

// 7. Avaliações
DataGrid(resultado.slots.avaliacoes,
  [{ titulo: 'Funcionário' }, { titulo: 'Data' }, { titulo: 'Nota' }],
  [
    { celulas: ['Carlos Silva', '15/07', '8,5'], onClick: () => abrirDrilldownGenerico('Avaliação — Carlos Silva', 'Nota: 8,5 · 15/07') },
    { celulas: ['Ana Souza', '10/07', '9,2'], onClick: () => abrirDrilldownGenerico('Avaliação — Ana Souza', 'Nota: 9,2 · 10/07') },
  ]
);

// 8. Treinamentos
DataGrid(resultado.slots.treinamentos,
  [{ titulo: 'Curso' }, { titulo: 'Participantes' }, { titulo: 'Status' }],
  [
    { celulas: ['NR-12 — Segurança em Máquinas', '12', '<span class="badge parcial">Em andamento</span>'], onClick: () => abrirDrilldownGenerico('NR-12 — Segurança em Máquinas', '12 participantes · Em andamento') },
    { celulas: ['Boas Práticas de Qualidade', '8', '<span class="badge pago">Concluído</span>'], onClick: () => abrirDrilldownGenerico('Boas Práticas de Qualidade', '8 participantes · Concluído') },
  ]
);

// 11. Painel da Liderança — grid de MetricCard
document.getElementById(resultado.slots.lideranca).innerHTML = `<div class="rh-lideranca-grid">${[
  MetricCard({ nome: 'Posições de Liderança', valorTexto: '9' }),
  MetricCard({ nome: 'Com Sucessor Mapeado', valorTexto: '6' }),
  MetricCard({ nome: 'Turnover de Líderes', valorTexto: '0%' }),
  MetricCard({ nome: 'Tempo Médio no Cargo', valorTexto: '3,2 anos' }),
].join('')}</div>`;

// ---------- Timeline (Área Operacional) ----------
const hoje = new Date().toISOString().slice(0,10);
TimelineEngine(resultado.slots.operational, [
  { id: '1', tipo: 'Treinamento', titulo: 'Turma NR-12 iniciada', data: hoje, hora: '08:00' },
  { id: '2', tipo: 'Avaliação', titulo: 'Avaliação de desempenho — Ana Souza', data: hoje, hora: '14:00', autor: 'RH' },
], { agrupamento: 'dia' });

// ---------- Drawers (SYS-011) ----------
function abrirDrilldownGenerico(titulo, texto) {
  DetailDrawer({ titulo, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">${texto}</p><p style="color:var(--ink-faint); font-size:12px; margin-top:8px;">Estrutura de drill-down pronta — detalhamento real aparece aqui quando ligado à consulta correspondente.</p>` });
}
function abrirDetalheKPI(id) {
  const nomes = { 'headcount': 'Headcount Total', 'turnover': 'Turnover Mensal', 'absenteismo': 'Absenteísmo', 'treinamentos-mes': 'Treinamentos no Mês' };
  DetailDrawer({ titulo: nomes[id] || id, subtitulo: 'Detalhamento (dado de exemplo)', corpo: `<p style="color:var(--ink-soft); font-size:13px;">Estrutura de drawer pronta pra este KPI — composição real aparece aqui quando ligada à consulta correspondente.</p>` });
}

// ---------- Pesquisa Global + Command Palette ----------
GlobalSearch('wl-header-busca', 'wl-header-busca-dropdown', (termo) => buscarGlobalReal(supabase, termo));
CommandPalette({
  telas: [
    { label: 'Minha Manhã', icone: 'sunrise', href: '../minha-manha.html' },
    { label: 'Decision Center', icone: 'sparkles', href: '../decision-center.html' },
    { label: 'RH', icone: 'users-round', href: 'dashboard.html' },
    { label: 'Produção', icone: 'factory', href: '../producao/dashboard.html' },
    { label: 'Qualidade', icone: 'badge-check', href: '../qualidade/dashboard.html' },
    { label: 'Financeiro', icone: 'wallet', href: '../financeiro/dashboard.html' },
  ],
  acoes: [{ label: 'Abrir Funcionários', icone: 'users', onExecutar: () => { window.location.href = 'funcionarios.html'; } }],
  buscarEntidades: (termo) => buscarGlobalReal(supabase, termo),
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
